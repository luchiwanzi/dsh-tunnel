name: Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    name: Publish to npm if version changed
    runs-on: ubuntu-latest
    if: github.repository_owner == 'luchiwanzi'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: 环境诊断
        run: |
          echo "=== node / npm / pnpm ==="
          node --version
          npm --version
          pnpm --version
          echo ""
          echo "=== package.json 身份 ==="
          node -p "require('./package.json').name + '@' + require('./package.json').version"
          echo ""
          echo "=== NODE_AUTH_TOKEN 是否设置（只打长度）==="
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "已设置，长度 ${#NODE_AUTH_TOKEN}"
          else
            echo "未设置！NPM_TOKEN secret 缺失"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 检查版本是否需要发布
        id: check
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "本地版本: $LOCAL ($NAME)"
          PUBLISHED=$(npm view "$NAME" version 2>/dev/null || echo "")
          echo "npm 上 latest: ${PUBLISHED:-（不存在）}"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
            echo "name=$NAME" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布到 npm
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "开始发布 ${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }}"
          set +e
          pnpm publish --access public --no-git-checks 2>&1 | tee publish.log
          EXIT=${PIPESTATUS[0]}
          set -e
          echo "publish 退出码: $EXIT"
          if [ "$EXIT" -ne 0 ]; then
            echo "发布失败，退出码 $EXIT"
            exit "$EXIT"
          fi
          echo "publish 命令返回成功"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布后验证
        if: steps.check.outputs.skip == 'false'
        run: |
          NAME="${{ steps.check.outputs.name }}"
          WANT="${{ steps.check.outputs.version }}"
          echo "等待 registry 同步..."
          sleep 15
          GOT=$(npm view "$NAME" version 2>/dev/null || echo "")
          echo "期望: $WANT / 实际 latest: $GOT"
          if [ "$GOT" != "$WANT" ]; then
            echo "发布未生效：latest 仍是 $GOT"
            exit 1
          fi
          echo "发布确认生效"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 只有 npm 发布成功后才建 tag + Release，避免「Release 有了但 npm 上没有」。
      # 用 GITHUB_TOKEN 创建的 tag 不会触发新的 workflow 运行，因此不会形成循环。
      # 说明正文用 heredoc 写进文件再走 --notes-file：bash 双引号里的 \n 是字面量，
      # 直接塞进 --notes 会让 Markdown 变成一行，代码块也无法渲染。
      - name: 创建 GitHub Release
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          TAG="v$VERSION"
          NAME="${{ steps.check.outputs.name }}"
          REPO="${{ github.repository }}"
          echo "准备为 $NAME@$VERSION 创建 Release（tag: $TAG）"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过创建"
            exit 0
          fi

          cat > release-notes.md <<RELEASE_NOTES
          ## 安装

          \`\`\`bash
          dsh plugin --profile <profile> add $NAME
          \`\`\`

          或在 DSH 的 **设置 → 插件市场** 中搜索 \`$NAME\`。

          ## 说明

          - 代理作用于 DSH 进程本身，不改系统代理、不动路由表。
          - 支持 Clash / mihomo 订阅与粘贴 YAML，本地解析。
          - 内核启动前做 SHA256 字节级校验。

          完整文档见 [README](https://github.com/$REPO#readme)。
          RELEASE_NOTES

          gh release create "$TAG" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

